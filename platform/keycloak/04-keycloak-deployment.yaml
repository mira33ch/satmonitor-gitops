apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: satmonitor-platform
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: satmonitor-platform
    version: "24.0.1"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak

  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/part-of: satmonitor-platform

    spec:
      serviceAccountName: keycloak

      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:24.0.1
          imagePullPolicy: IfNotPresent

          # start-dev: HTTP enabled by default, no TLS required
          # --import-realm: auto-imports from /opt/keycloak/data/import/ on first start
          args:
            - "start"
            - "--import-realm"
            - "--http-enabled=true"
            - "--hostname-strict=false"
            - "--hostname-strict-https=false"

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL_HOST
              valueFrom:
                configMapKeyRef:
                  name: keycloak-config
                  key: db_host
            - name: KC_DB_URL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: keycloak-config
                  key: db_name
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: db_username
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: db_password
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: admin_user
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: admin_password
            - name: KC_HOSTNAME_URL
              value: "http://auth.satmonitor.cloud"
            - name: KC_HOSTNAME_ADMIN_URL
              value: "http://auth.satmonitor.cloud"
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            - name: KC_LOG_LEVEL
              value: "INFO"

          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 60
            periodSeconds: 2

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi

          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
            - name: tmp
              mountPath: /tmp

      terminationGracePeriodSeconds: 60

      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm-import
        - name: tmp
          emptyDir: {}
