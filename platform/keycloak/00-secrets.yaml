apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secrets
  namespace: satmonitor-platform
type: Opaque
stringData:
  # Keys used by keycloak-postgres deployment (uppercase)
  POSTGRES_DB: keycloak
  POSTGRES_USER: keycloak
  POSTGRES_PASSWORD: keycloak12345

  # Keys used by keycloak deployment (lowercase — must match deployment secretKeyRef)
  db_username: keycloak
  db_password: keycloak12345
  admin_user: admin
  admin_password: admin12345
