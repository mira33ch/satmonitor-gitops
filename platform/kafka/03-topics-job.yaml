# One-shot Job that creates the required Kafka topics after the broker is ready.
# Re-run manually if topics need to be recreated: kubectl delete job kafka-create-topics -n satmonitor-platform
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-create-topics
  namespace: satmonitor-platform
  labels:
    app.kubernetes.io/name: kafka-init
    app.kubernetes.io/part-of: satmonitor-platform
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - until nc -z kafka.satmonitor-platform.svc.cluster.local 9092; do echo "waiting for kafka..."; sleep 5; done
      containers:
        - name: create-topics
          image: bitnami/kafka:3.7.1
          command:
            - /bin/bash
            - -c
            - |
              BOOTSTRAP=kafka.satmonitor-platform.svc.cluster.local:9092
              kafka-topics.sh --bootstrap-server $BOOTSTRAP \
                --create --if-not-exists \
                --topic satmonitor-jobs \
                --partitions 3 \
                --replication-factor 1

              kafka-topics.sh --bootstrap-server $BOOTSTRAP \
                --create --if-not-exists \
                --topic satmonitor-results \
                --partitions 1 \
                --replication-factor 1

              kafka-topics.sh --bootstrap-server $BOOTSTRAP \
                --create --if-not-exists \
                --topic satmonitor-jobs.DLT \
                --partitions 1 \
                --replication-factor 1

              echo "All topics created."
              kafka-topics.sh --bootstrap-server $BOOTSTRAP --list
