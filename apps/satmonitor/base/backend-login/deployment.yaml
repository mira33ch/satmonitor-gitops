---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: satmonitor-backend-login
  namespace: satmonitor-dev
  labels:
    app.kubernetes.io/name: satmonitor-backend-login
    app.kubernetes.io/part-of: satmonitor
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: satmonitor-backend-login
  template:
    metadata:
      labels:
        app.kubernetes.io/name: satmonitor-backend-login
        app.kubernetes.io/part-of: satmonitor
    spec:
      containers:
        - name: backend-login
          image: mariem360/satmonitor-backend-login:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          
          # Configuration from ConfigMap and Secrets
          envFrom:
            - configMapRef:
                name: satmonitor-backend-config
            - secretRef:
                name: satmonitor-backend-secrets
          
          env:
            - name: SERVER_PORT
              value: "8080"
          
          # Health checks - critical for Kubernetes to manage pod lifecycle
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          
          # Resource limits - prevents pod eviction and cluster overload
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
