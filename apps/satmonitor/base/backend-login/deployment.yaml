apiVersion: apps/v1
kind: Deployment
metadata:
  name: login-service
  namespace: satmonitor-dev
  labels:
    app.kubernetes.io/name: login-service
    app.kubernetes.io/part-of: satmonitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: login-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: login-service
        app.kubernetes.io/part-of: satmonitor
    spec:
      containers:
        - name: login-service
          image: mariem360/login-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8087
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
            - name: SERVER_PORT
              value: "8087"
          envFrom:
            - configMapRef:
                name: login-service-config
            - secretRef:
                name: login-service-secrets
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: avatars
              mountPath: /app/uploads/avatars
      volumes:
        - name: avatars
          persistentVolumeClaim:
            claimName: login-service-uploads
