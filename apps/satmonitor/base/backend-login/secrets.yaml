apiVersion: v1
kind: Secret
metadata:
  name: login-service-secrets
  namespace: satmonitor-dev
  labels:
    app.kubernetes.io/name: login-service
    app.kubernetes.io/part-of: satmonitor
type: Opaque
stringData:
  # Database
  DB_USERNAME: "satmonitor_app"
  DB_PASSWORD: "change-me-in-production"

  # Keycloak admin (used to manage users via admin REST API)
  KEYCLOAK_ADMIN_USERNAME: "admin"
  KEYCLOAK_ADMIN_PASSWORD: "admin12345"

  # Keycloak client secret for login-service client (get from Keycloak admin UI)
  KEYCLOAK_CLIENT_SECRET: "change-me-get-from-keycloak"

  # Mail
  MAIL_USERNAME: "change-me@gmail.com"
  MAIL_PASSWORD: "change-me-app-password"
