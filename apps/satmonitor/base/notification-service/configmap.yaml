apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
  namespace: satmonitor-dev
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/part-of: satmonitor
data:
  # Keycloak (wired for future use — anyRequest().permitAll() for now)
  # NOTE: Keycloak's KC_HOSTNAME_URL is satmonitor.cloud:32525, so every JWT's
  # `iss` claim is the public URL. ISSUER_URI must match it (for issuer
  # validation); JWK_SET_URI stays internal to avoid hairpin NAT for key fetch.
  KEYCLOAK_ISSUER_URI: "http://satmonitor.cloud:32525/auth/realms/microservices-realm"
  KEYCLOAK_JWK_SET_URI: "http://keycloak.satmonitor-platform.svc.cluster.local:8080/auth/realms/microservices-realm/protocol/openid-connect/certs"
  JWT_AUTH_CONVERTER_RESOURCE_ID: "notification-service"
  JWT_AUTH_CONVERTER_PRINCIPLE_ATTRIBUTE: "preferred_username"

  # Kafka — set for forward-compat; KafkaConsumerConfig.java currently
  # hardcodes localhost:9092 and the consumer group id (app-side bug, not
  # a gitops issue).
  KAFKA_BOOTSTRAP_SERVERS: "kafka.satmonitor-platform.svc.cluster.local:9092"

  # Mail (credentials + from address are in the Secret)
  MAIL_HOST: "smtp.ionos.fr"
  MAIL_PORT: "465"

  # Other services
  LOGIN_SERVICE_URL: "http://login-service.satmonitor-dev.svc.cluster.local:8087"

  # Public base URL used for links generated in emails
  APP_BASE_URL: "http://satmonitor.cloud:32525"
