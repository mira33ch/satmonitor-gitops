---
# Application Ingress - Routes ONLY application traffic
# Platform services (keycloak, sonarqube) have their own Ingress resources
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: satmonitor-app
  namespace: satmonitor-dev
  labels:
    app.kubernetes.io/name: satmonitor-ingress
    app.kubernetes.io/part-of: satmonitor
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure

spec:
  ingressClassName: traefik

  # TLS configuration - enable when certificate is ready
  tls:
    - secretName: satmonitor-app-tls
      hosts:
        - app.satmonitor.local

  rules:
    - host: app.satmonitor.local
      http:
        paths:
          # Backend API - Authentication service
          - path: /api/v1/auth
            pathType: Prefix
            backend:
              service:
                name: satmonitor-backend-login
                port:
                  number: 8080

          # Frontend UI
          - path: /app
            pathType: Prefix
            backend:
              service:
                name: satmonitor-frontend
                port:
                  number: 80

          # Geo-spatial service
          - path: /geoserver
            pathType: Prefix
            backend:
              service:
                name: satmonitor-geoserver
                port:
                  number: 8080
