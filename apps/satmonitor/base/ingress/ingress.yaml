apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: satmonitor-app
  namespace: satmonitor-dev
  labels:
    app.kubernetes.io/name: satmonitor-ingress
    app.kubernetes.io/part-of: satmonitor
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: satmonitor-dev-cors@kubernetescrd,satmonitor-dev-strip-login-prefix@kubernetescrd,satmonitor-dev-strip-job-prefix@kubernetescrd,satmonitor-dev-strip-alert-prefix@kubernetescrd,satmonitor-dev-strip-notification-prefix@kubernetescrd,satmonitor-dev-strip-project-prefix@kubernetescrd
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - satmonitor.cloud
      secretName: satmonitor-tls

  rules:
    - host: satmonitor.cloud
      http:
        paths:
          # More specific than /api/login-service — routes WebSocket to
          # notification-service. strip-login-prefix middleware strips
          # /api/login-service so notification-service receives /ws-notifications.
          - path: /api/login-service/ws-notifications
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 8085

          - path: /api/login-service
            pathType: Prefix
            backend:
              service:
                name: login-service
                port:
                  number: 8087

          - path: /api/job-service
            pathType: Prefix
            backend:
              service:
                name: job-service
                port:
                  number: 8088

          - path: /api/alert-service
            pathType: Prefix
            backend:
              service:
                name: alert-service
                port:
                  number: 8082

          - path: /api/notification-service
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 8085

          - path: /api/project-service
            pathType: Prefix
            backend:
              service:
                name: project-service
                port:
                  number: 8089

          # notification-service WebSocket endpoint — served at this exact
          # path by the app, so no stripPrefix middleware applies to it
          - path: /ws-notifications
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 8085

          # GeoServer's own webapp context path is /geoserver, so no
          # stripPrefix middleware applies to it either
          - path: /geoserver
            pathType: Prefix
            backend:
              service:
                name: geoserver
                port:
                  number: 8080

          - path: /
            pathType: Prefix
            backend:
              service:
                name: satmonitor-frontend
                port:
                  number: 80
