apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: satmonitor-app
  namespace: satmonitor-dev
  labels:
    app.kubernetes.io/name: satmonitor-ingress
    app.kubernetes.io/part-of: satmonitor
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik

  tls:
    - secretName: satmonitor-app-tls
      hosts:
        - app.satmonitor.cloud
        - api.satmonitor.cloud

  rules:
    # Frontend — app.satmonitor.cloud
    - host: app.satmonitor.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: satmonitor-frontend
                port:
                  number: 80

    # API gateway — api.satmonitor.cloud (path-based split)
    - host: api.satmonitor.cloud
      http:
        paths:
          - path: /api/v1/auth
            pathType: Prefix
            backend:
              service:
                name: login-service
                port:
                  number: 8087

          - path: /api/v1/jobs
            pathType: Prefix
            backend:
              service:
                name: job-service
                port:
                  number: 8088
