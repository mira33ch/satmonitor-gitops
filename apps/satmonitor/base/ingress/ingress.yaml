apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: satmonitor-app
  namespace: satmonitor-dev
  labels:
    app.kubernetes.io/name: satmonitor-ingress
    app.kubernetes.io/part-of: satmonitor
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: satmonitor-dev-cors@kubernetescrd,satmonitor-dev-strip-login-prefix@kubernetescrd,satmonitor-dev-strip-job-prefix@kubernetescrd
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - satmonitor.cloud
      secretName: satmonitor-tls

  rules:
    - host: satmonitor.cloud
      http:
        paths:
          - path: /api/login-service
            pathType: Prefix
            backend:
              service:
                name: login-service
                port:
                  number: 8087

          - path: /api/job-service
            pathType: Prefix
            backend:
              service:
                name: job-service
                port:
                  number: 8088

          - path: /
            pathType: Prefix
            backend:
              service:
                name: satmonitor-frontend
                port:
                  number: 80
