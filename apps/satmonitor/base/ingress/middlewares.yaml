---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cors
  namespace: satmonitor-dev
spec:
  headers:
    accessControlAllowMethods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
      - PATCH
    accessControlAllowHeaders:
      - Content-Type
      - Authorization
      - Accept
      - Origin
      - X-Requested-With
      - userid
    accessControlAllowOriginList:
      - "https://satmonitor.cloud"
      - "http://satmonitor.cloud"
      - "http://satmonitor.cloud:32525"
      - "http://localhost:3000"
      - "http://localhost:4200"
    accessControlExposeHeaders:
      - Set-Cookie
      - Authorization
    accessControlAllowCredentials: true
    accessControlMaxAge: 100
    addVaryHeader: true
