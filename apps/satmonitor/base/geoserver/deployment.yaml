---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: satmonitor-geoserver
  namespace: satmonitor-dev
  labels:
    app.kubernetes.io/name: satmonitor-geoserver
    app.kubernetes.io/part-of: satmonitor
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: satmonitor-geoserver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: satmonitor-geoserver
        app.kubernetes.io/part-of: satmonitor
    spec:
      containers:
        - name: geoserver
          image: kartoza/geoserver:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          
          # Health checks
          livenessProbe:
            httpGet:
              path: /geoserver
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 15
          
          
          readinessProbe:
            httpGet:
              path: /geoserver
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 10
          
          
          # Resource limits
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
           
