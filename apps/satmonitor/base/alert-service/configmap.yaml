apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-service-config
  namespace: satmonitor-dev
  labels:
    app.kubernetes.io/name: alert-service
    app.kubernetes.io/part-of: satmonitor
data:
  # Datasource
  DB_URL: "jdbc:postgresql://satmonitor-postgres.satmonitor-dev.svc.cluster.local:5432/satmonitor_db"

  # Keycloak
  KEYCLOAK_ISSUER_URI: "http://keycloak.satmonitor-platform.svc.cluster.local:8080/auth/realms/microservices-realm"
  JWT_AUTH_CONVERTER_RESOURCE_ID: "alert-service"
  JWT_AUTH_CONVERTER_PRINCIPLE_ATTRIBUTE: "preferred_username"

  # Kafka
  KAFKA_BOOTSTRAP_SERVERS: "kafka.satmonitor-platform.svc.cluster.local:9092"

  # Other services
  JOB_SERVICE_URL: "http://job-service.satmonitor-dev.svc.cluster.local:8088"
