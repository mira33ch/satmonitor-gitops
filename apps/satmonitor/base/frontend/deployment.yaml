---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: satmonitor-frontend
  namespace: satmonitor-dev
  labels:
    app.kubernetes.io/name: satmonitor-frontend
    app.kubernetes.io/part-of: satmonitor
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: satmonitor-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: satmonitor-frontend
        app.kubernetes.io/part-of: satmonitor
    spec:
      containers:
        - name: frontend
          image: mariem360/satmonitor-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          
          # Load configuration from ConfigMap
          envFrom:
            - configMapRef:
                name: satmonitor-frontend-config
          
          # Health checks
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 5
            
          
          # Resource limits
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
