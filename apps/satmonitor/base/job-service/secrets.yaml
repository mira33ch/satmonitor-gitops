apiVersion: v1
kind: Secret
metadata:
  name: job-service-secrets
  namespace: satmonitor-dev
  labels:
    app.kubernetes.io/name: job-service
    app.kubernetes.io/part-of: satmonitor
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: "satmonitor_app"
  SPRING_DATASOURCE_PASSWORD: "change-me-in-production"
  # URL of the Python ML pipeline service inside the cluster
  PIPELINE_URL: "http://ml-service:8000"
