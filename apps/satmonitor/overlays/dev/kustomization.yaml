apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: satmonitor-dev

resources:
  - ../../base

labels:
  - pairs:
      environment: dev
      app.kubernetes.io/part-of: satmonitor

patches:

  #  Only replicas (SAFE)
  - target:
      kind: Deployment
      name: satmonitor-backend-login
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

  - target:
      kind: Deployment
      name: satmonitor-frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

  - target:
      kind: Deployment
      name: satmonitor-geoserver
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

images:
  - name: mariem360/satmonitor-backend-login
    newTag: "51e4db8"

  - name: mariem360/satmonitor-frontend
    newTag: "51e4db8"

  - name: mariem360/satmonitor-geoserver
    newTag: "51e4db8"
