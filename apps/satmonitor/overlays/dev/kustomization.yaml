apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: satmonitor-dev
resources:
- ../../base
labels:
- pairs:
    environment: dev
    app.kubernetes.io/part-of: satmonitor
patches:
- target:
    kind: Deployment
    name: satmonitor-backend-login
  patch: "- op: replace\n  path: /spec/replicas\n  value: 1"
- target:
    kind: Deployment
    name: satmonitor-frontend
  patch: "- op: replace\n  path: /spec/replicas\n  value: 1"
- target:
    kind: Deployment
    name: satmonitor-geoserver
  patch: "- op: replace\n  path: /spec/replicas\n  value: 1"
- target:
    kind: Deployment
    name: satmonitor-backend-login
  patch: "- op: replace\n  path: /spec/template/spec/containers/0/resources/requests/cpu\n\
    \  value: 100m\n- op: replace\n  path: /spec/template/spec/containers/0/resources/requests/memory\n\
    \  value: 256Mi\n- op: replace\n  path: /spec/template/spec/containers/0/resources/limits/cpu\n\
    \  value: 500m\n- op: replace\n  path: /spec/template/spec/containers/0/resources/limits/memory\n\
    \  value: 512Mi"
- target:
    kind: Deployment
    name: satmonitor-frontend
  patch: "- op: replace\n  path: /spec/template/spec/containers/0/resources/requests/cpu\n\
    \  value: 50m\n- op: replace\n  path: /spec/template/spec/containers/0/resources/requests/memory\n\
    \  value: 128Mi\n- op: replace\n  path: /spec/template/spec/containers/0/resources/limits/cpu\n\
    \  value: 250m\n- op: replace\n  path: /spec/template/spec/containers/0/resources/limits/memory\n\
