apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: satmonitor-dev

resources:
  - ../../base
  - ../../base/backend-login
  - ../../base/job-service
  - ../../base/frontend

labels:
  - pairs:
      environment: dev
      app.kubernetes.io/part-of: satmonitor

patches:
  - target:
      kind: Deployment
      name: login-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

  - target:
      kind: Deployment
      name: job-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

  - target:
      kind: Deployment
      name: satmonitor-frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

images:
  - name: mariem360/login-service
    newTag: 5922112

  - name: mariem360/job-service
    newTag: latest

  - name: mariem360/frontend
    newTag: 5aca171
