apiVersion: apps/v1
kind: Deployment
metadata:
  name: satmonitor-postgres
  namespace: satmonitor-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: satmonitor-postgres
  template:
    metadata:
      labels:
        app: satmonitor-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: satmonitor_db
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: postgres123

---
apiVersion: v1
kind: Service
metadata:
  name: satmonitor-postgres
  namespace: satmonitor-dev
spec:
  selector:
    app: satmonitor-postgres
  ports:
  - port: 5432
    targetPort: 5432