apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: satmonitor-platform
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: ">=60.0.0 <70.0.0"
    helm:
      values: |
        crds:
          enabled: false

        alertmanager:
          enabled: false

        prometheus:
          prometheusSpec:
            retention: 2d
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 200m
                memory: 256Mi
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: nfs-client
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 5Gi

        grafana:
          persistence:
            enabled: true
            storageClassName: nfs-client
            accessModes: ["ReadWriteOnce"]
            size: 1Gi
          resources:
            requests:
              cpu: 30m
              memory: 96Mi
            limits:
              cpu: 100m
              memory: 160Mi
          additionalDataSources:
            - name: Loki
              type: loki
              url: http://loki.monitoring.svc.cluster.local:3100
              access: proxy
              isDefault: false

        kubeStateMetrics:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi

        prometheus-node-exporter:
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 50m
              memory: 48Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
