apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: satmonitor-platform
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki-stack
    targetRevision: ">=2.9.0 <3.0.0"
    helm:
      values: |
        grafana:
          enabled: false
        prometheus:
          enabled: false
        fluent-bit:
          enabled: false

        loki:
          persistence:
            enabled: true
            storageClassName: nfs-client
            accessModes: ["ReadWriteOnce"]
            size: 5Gi
          resources:
            requests:
              cpu: 30m
              memory: 96Mi
            limits:
              cpu: 100m
              memory: 160Mi
          config:
            limits_config:
              retention_period: 24h
            compactor:
              retention_enabled: true
              retention_delete_delay: 2h
              working_directory: /data/compactor
            table_manager:
              retention_deletes_enabled: true
              retention_period: 24h

        promtail:
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 50m
              memory: 48Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
